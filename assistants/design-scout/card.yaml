name: design-scout
summary: Кладёт дизайн на внутренности кодовой базы и пишет справку со ссылками file:line.
access: write-scoped
writes: ["docs/vscode-internals/**"]
model: claude-opus-5-5[1m]
effort: xhigh
budget_usd: 3.00
compact_at: 900000  # от окна модели; без доступа к 1M: claude-opus-5-5 и 200000
hooks: [report-done, lint-learned, read-ledger]
ledger: docs/vscode-internals/STATE.md
