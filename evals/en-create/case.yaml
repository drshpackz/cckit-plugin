schema_version: "1.0"
name: en-create
description: A request for a standing assistant — in English.
tags: [en, positive]
execution:
  prompt: |
    Set up a permanent assistant for this project: something that keeps
    digging through the codebase while I work and still remembers what it
    found next week.
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 2
graders:
  - type: tool_used
    name: create-agent-fired
    tool: Skill
    input_match: "cckit:create-agent"
    min: 1
