schema_version: "1.0"
name: ru-offtopic
description: Вопрос не по теме. Не должен сработать ни один скилл.
tags: [ru, negative]
execution:
  prompt: |
    Объясни в двух абзацах, чем TCP отличается от UDP.
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 2
graders:
  - type: tool_used
    name: no-cckit-skill
    tool: Skill
    input_match: "cckit:"
    min: 0
    max: 0
  # См. ru-code: отрицательный случай обязан доказать, что прогон состоялся.
  - type: regex
    name: answer-does-the-work
    target: last_message
    pattern: "udp"
    flags: "i"
    match: contains
