schema_version: "1.0"
name: ru-find
description: Вопрос «нет ли готовой роли» — по-русски.
tags: [ru, positive]
execution:
  prompt: |
    Есть ли где-то готовая, кем-то уже опубликованная роль для ревью кода,
    которую можно поставить, а не писать свою с нуля?
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 2
graders:
  - type: tool_used
    name: find-agent-fired
    tool: Skill
    input_match: "cckit:find-agent"
    min: 1
